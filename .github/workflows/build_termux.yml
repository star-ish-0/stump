name: Build Server + Web (ARM64)

on:
  workflow_dispatch:

jobs:
  build-server-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========== Web ==========
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Yarn
        run: corepack enable

      - name: Install web dependencies
        run: yarn install
        working-directory: apps/web

      - name: Build web frontend
        run: yarn build
        working-directory: apps/web

      - name: Move dist to bundle location
        run: |
          mkdir -p apps/dist
          cp -r apps/web/dist/* apps/dist/
          ls apps/dist | head

      # ========== Server (aarch64 musl, static) ==========
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-aarch64-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-aarch64-musl-

      - name: Build server (aarch64-unknown-linux-musl)
        run: |
          sed -i '/apps\/desktop\/src-tauri/d' Cargo.toml
          cross build --release --target aarch64-unknown-linux-musl -p stump_server
          file target/aarch64-unknown-linux-musl/release/stump_server

      # ========== PDFium (arm64) ==========
      - name: Download PDFium (linux-arm64)
        run: |
          mkdir -p pdfium
          curl -sLo pdfium.tgz https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7763/pdfium-linux-arm64.tgz
          tar -xzf pdfium.tgz -C pdfium
          echo "c23942df3dc35f95a7bfa75fc52a480e77b5b0ca  pdfium/lib/libpdfium.so" | sha1sum -c -
          rm pdfium.tgz

      # ========== Package ==========
      - name: Create deployment package
        run: |
          mkdir -p stump-arm64/lib
          cp target/aarch64-unknown-linux-musl/release/stump_server stump-arm64/
          cp -r apps/dist stump-arm64/dist
          cp pdfium/lib/libpdfium.so stump-arm64/lib/

          cat > stump-arm64/run.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export STUMP_CLIENT_DIR="$DIR/dist"
          export PDFIUM_PATH="$DIR/lib/libpdfium.so"
          echo "Starting Stump Server (web at $STUMP_CLIENT_DIR)..."
          exec "$DIR/stump_server" "$@"
          EOF
          chmod +x stump-arm64/run.sh

          cat > stump-arm64/README.md << 'EOF'
          # Stump Server + Web (Linux ARM64, musl static)

          Binario estatico: roda em qualquer distro Linux ARM64 com glibc ou musl,
          incluindo Debian no proot-distro (Termux).

          ## Como usar (proot-distro debian no Termux)

          ```bash
          tar xzf stump-server-web-arm64.tar.gz
          cd stump-arm64
          ./run.sh
          ```

          - Web: http://localhost:10801
          - Binario: stump_server (estatico, nao depende de libs do sistema)
          - dist/: interface web embutida (STUMP_CLIENT_DIR)
          - lib/libpdfium.so: suporte a PDF (PDFIUM_PATH)

          ## Configuracao

          ```bash
          STUMP_PORT=1337 STUMP_CLIENT_DIR=./dist ./stump_server
          ```
          EOF

          ls -la stump-arm64/

      - name: Create tarball
        run: |
          tar czf stump-server-web-arm64.tar.gz stump-arm64/
          ls -lh stump-server-web-arm64.tar.gz

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: stump-server-web-arm64
          path: stump-server-web-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14