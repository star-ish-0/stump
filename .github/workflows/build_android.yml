name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup-yarn

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Generate native Android project
        working-directory: apps/expo
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --no-install

      - name: Generate temporary release keystore
        working-directory: apps/expo/android
        run: |
          keytool -genkeypair -v \
            -keystore temp-release.keystore \
            -alias temp-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass stump-temp-password \
            -keypass stump-temp-password \
            -dname "CN=Stump, OU=Dev, O=Stump, L=Stump, S=Stump, C=US"

      - name: Build release APK
        working-directory: apps/expo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$PWD/temp-release.keystore" \
            -Pandroid.injected.signing.store.password=stump-temp-password \
            -Pandroid.injected.signing.store.key.alias=temp-alias \
            -Pandroid.injected.signing.store.key.password=stump-temp-password

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stump-android-release-apk
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error